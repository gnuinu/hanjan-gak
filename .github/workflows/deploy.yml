name: deploy

on:
  push: { branches: [main] }
  workflow_dispatch:

# GitHub Actions 로 Pages 에 올린다.
#
# 저장소 설정: Settings -> Pages -> Source 를 "GitHub Actions" 로 둘 것.
# "Deploy from a branch" 로 되어 있으면 배포가 deployment_queued 에서
# 안 넘어가고 10분 뒤 타임아웃 난다.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 진행 중인 배포는 끊지 않는다 (GitHub 권장값)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # timeout 은 액션이 허용하는 최대값이 10분이다. 그보다 크게 주면
      # 경고를 내고 어차피 600000 으로 깎인다.
      #
      # 배포 ID = 커밋 SHA 라서, 한 번 취소(타임아웃 포함)된 커밋은
      # 같은 커밋으로 재실행해도 "Deployment cancelled" 로 즉사한다.
      # 그럴 땐 Re-run 대신 새 커밋을 올려야 한다.
      - id: deployment
        uses: actions/deploy-pages@v4
        with: { timeout: 600000 }
