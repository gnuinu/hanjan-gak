name: deploy

on:
  push: { branches: [main] }
  workflow_dispatch:

# 빌드 결과를 gh-pages 브랜치에 직접 밀어 넣는다.
#
# actions/deploy-pages 방식은 이 저장소에서 배포가 deployment_queued 에
# 붙잡힌 채 10분 타임아웃 나는 문제가 반복돼서 걷어냈다. 그쪽은 Pages
# 백엔드가 워크플로 배포를 집어가야 진행되는데, 워크플로에서 손댈 수 있는
# 부분이 아니었다. 이 방식은 그냥 git push 라서 그 경로를 안 탄다.
#
# 저장소 설정: Settings -> Pages -> Source 를 "Deploy from a branch" 로,
# 브랜치는 gh-pages / 폴더는 / (root) 로 둘 것.

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Push to gh-pages
        run: |
          # Jekyll 전처리를 끈다. 없으면 _ 로 시작하는 파일이 사라진다.
          touch dist/.nojekyll
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA::7}"
          # 히스토리는 남길 이유가 없다. 매번 덮어쓴다.
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
