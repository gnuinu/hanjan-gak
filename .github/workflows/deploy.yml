name: deploy

on:
  push: { branches: [main] }
  workflow_dispatch:

# 블록 스타일로 명시한다. deploy-pages 는 id-token 으로 받은 OIDC 토큰으로
# 배포를 인가하는데, 이 권한이 실제로 안 붙으면 에러 없이 deployment_queued
# 상태에 그대로 남아 타임아웃 난다.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 진행 중인 배포는 끊지 않는다 (GitHub 권장값)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages 소스를 GitHub Actions 로 맞춘다.
      # 저장소 설정이 "Deploy from a branch" 인 동안에는 배포가
      # deployment_queued 에서 안 넘어가고 타임아웃 난다.
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # timeout 은 액션이 허용하는 최대값이 10분이다. 그보다 크게 주면
      # 경고를 내고 어차피 600000 으로 깎인다.
      #
      # 배포 ID = 커밋 SHA 라서, 한 번 취소(타임아웃 포함)된 커밋은
      # 같은 커밋으로 재실행해도 "Deployment cancelled" 로 즉사한다.
      # 그럴 땐 Re-run 대신 새 커밋을 올려야 한다.
      - id: deployment
        uses: actions/deploy-pages@v4
        with: { timeout: 600000 }
