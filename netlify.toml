# Netlify 로 올릴 때 쓰는 설정.
# 도메인 루트에서 서빙되므로 base 를 / 로 내린다.
#
# Cloudflare Pages 는 설정 파일 대신 대시보드에서 같은 값을 넣으면 된다:
#   빌드 명령      npm run build
#   출력 디렉터리   dist
#   환경 변수      BASE_PATH = /

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"
